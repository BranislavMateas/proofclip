<!doctype html>
<html>
<head><meta charset="utf-8"><title>Proofclip history</title><link rel="stylesheet" href="ui.css">
<style>
  body { max-width: 900px; margin: 28px auto; padding: 0 16px; font-size: 14px; }
  h1 { font-size: 20px; margin: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  td.actions { white-space: nowrap; text-align: right; } td.actions button { padding: 2px 8px; font-size: 12px; }
  .detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row"><h1 class="grow">Clip history</h1><button id="retryAll">Retry failed</button><button id="export">Export backup</button><button id="importBtn">Import backup</button><input id="import" type="file" accept="application/json" hidden></div>
  <p class="muted">Every clip is stored here before upload, so nothing is lost if Notion fails. Backups include full content.</p>
  <table><thead><tr><th>Clip</th><th>Status</th><th>Saved</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  <p id="empty" class="muted" hidden>No clips yet.</p>
  <script type="module" src="history.js"></script>
</body>
</html>
